kind = "web"
  previewPath = "/"
  title = "MedWay"
  version = "1.0.0"
  id = "artifacts/medway"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 3000

  [services.development]
  run = "pnpm --filter @workspace/medway run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/medway", "run", "build" ]
  run = [ "pnpm", "--filter", "@workspace/medway", "run", "start" ]

  [services.env]
  PORT = "3000"
  BASE_PATH = "/"
  